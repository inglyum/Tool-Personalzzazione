


<!-- ═══════════════════════════════════════════════════════════
  💡 INSPIRE BOARD v14 — Full-screen overlay, self-contained
  Works independently of ALL section-view/App.navigate systems
════════════════════════════════════════════════════════════ -->
<div id="inspire-board-overlay" style="display:none;position:fixed;inset:0;z-index:999999;background:#0d0d14;overflow:hidden;flex-direction:column">
  <div id="ib-topbar" style="display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:10px;flex:0 0 auto">
      <div style="width:38px;height:38px;background:linear-gradient(135deg,#fbbf24,#f59e0b);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px">💡</div>
      <div>
        <div style="font-size:17px;font-weight:900;color:#fff">Idee &amp; Ispirazione</div>
        <div style="font-size:10px;color:rgba(255,255,255,.4)">Salva link, immagini, file e idee per nuovi prodotti laser</div>
      </div>
    </div>
    <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-left:auto">
      <input type="text" id="ib-search" placeholder="🔍 Cerca..." oninput="InspireBoard.search(this.value)"
        style="padding:7px 11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:9px;color:#fff;font-size:12px;width:160px;outline:none">
      <select id="ib-filter-cat" onchange="InspireBoard.filter()"
        style="padding:7px 9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:9px;color:#fff;font-size:11px;cursor:pointer">
        <option value="">Tutte categorie</option>
        <option value="prodotto">📦 Prodotto</option>
        <option value="design">🎨 Design</option>
        <option value="marketing">📣 Marketing</option>
        <option value="materiale">🪵 Materiale</option>
        <option value="tecnica">⚙️ Tecnica</option>
        <option value="altro">✏️ Altro</option>
      </select>
      <select id="ib-filter-pri" onchange="InspireBoard.filter()"
        style="padding:7px 9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:9px;color:#fff;font-size:11px;cursor:pointer">
        <option value="">Tutte priorità</option>
        <option value="alta">🔴 Alta</option>
        <option value="media">🟡 Media</option>
        <option value="bassa">🟢 Bassa</option>
      </select>
      <button onclick="InspireBoard.openAdd()"
        style="padding:7px 16px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1200;border:none;border-radius:9px;cursor:pointer;font-size:12px;font-weight:800">+ Aggiungi</button>
      <button onclick="InspireBoard.openAddUrl()"
        style="padding:7px 13px;background:rgba(16,185,129,.12);color:#10b981;border:1.5px solid rgba(16,185,129,.3);border-radius:9px;cursor:pointer;font-size:12px;font-weight:700">🔗 Da URL</button>
      <button onclick="InspireBoard.showTop20()"
        style="padding:7px 13px;background:rgba(251,191,36,.08);color:#fbbf24;border:1.5px solid rgba(251,191,36,.25);border-radius:9px;cursor:pointer;font-size:12px;font-weight:700">🏆 Top 20</button>
      <button onclick="InspireBoard.close()"
        style="padding:7px 13px;background:rgba(239,68,68,.08);color:#ef4444;border:1px solid rgba(239,68,68,.2);border-radius:9px;cursor:pointer;font-size:12px">✕ Chiudi</button>
    </div>
  </div>
  <div id="ib-stats" style="display:flex;gap:8px;padding:8px 18px;background:rgba(255,255,255,.02);border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0;flex-wrap:wrap;align-items:center;min-height:38px"></div>
  <div id="ib-content" style="flex:1;overflow-y:auto;padding:14px 18px"></div>
</div>

<!-- Add/Edit Modal -->
<div id="ib-modal" style="display:none;position:fixed;inset:0;z-index:9999999;background:rgba(0,0,0,.85);align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this) InspireBoard.closeModal()">
  <div style="background:#1a1a2e;border-radius:16px;width:min(600px,100%);max-height:92vh;overflow-y:auto;border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 80px rgba(0,0,0,.7)" onclick="event.stopPropagation()">
    <div style="padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#1a1a2e;border-radius:16px 16px 0 0">
      <span style="font-size:22px">💡</span>
      <span id="ib-modal-title" style="flex:1;font-size:15px;font-weight:800;color:#fff">Nuova Idea</span>
      <button onclick="InspireBoard.closeModal()" style="background:none;border:none;cursor:pointer;color:rgba(255,255,255,.4);font-size:20px;line-height:1">✕</button>
    </div>
    <div style="padding:16px;display:flex;flex-direction:column;gap:11px">
      <div>
        <label style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;display:block;margin-bottom:4px">Titolo *</label>
        <input id="ib-f-title" placeholder="Es. Taglieri personalizzati mappa città..." style="width:100%;padding:9px 12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:9px;color:#fff;font-size:13px;outline:none;box-sizing:border-box">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div>
          <label style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;display:block;margin-bottom:4px">Categoria</label>
          <select id="ib-f-cat" style="width:100%;padding:9px 10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:9px;color:#fff;font-size:12px;cursor:pointer;box-sizing:border-box">
            <option value="prodotto">📦 Prodotto</option>
            <option value="design">🎨 Design</option>
            <option value="marketing">📣 Marketing</option>
            <option value="materiale">🪵 Materiale</option>
            <option value="tecnica">⚙️ Tecnica</option>
            <option value="altro">✏️ Altro</option>
          </select>
        </div>
        <div>
          <label style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;display:block;margin-bottom:4px">Priorità</label>
          <select id="ib-f-pri" style="width:100%;padding:9px 10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:9px;color:#fff;font-size:12px;cursor:pointer;box-sizing:border-box">
            <option value="alta">🔴 Alta priorità</option>
            <option value="media" selected>🟡 Media priorità</option>
            <option value="bassa">🟢 Bassa priorità</option>
          </select>
        </div>
      </div>
      <div>
        <label style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;display:block;margin-bottom:4px">URL ispirazione</label>
        <div style="display:flex;gap:7px">
          <input id="ib-f-url" type="url" placeholder="https://etsy.com/ oppure qualsiasi link..." style="flex:1;padding:9px 12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:9px;color:#fff;font-size:12px;outline:none;min-width:0">
          <button onclick="InspireBoard.fetchMeta()" style="padding:8px 12px;background:rgba(16,185,129,.12);color:#10b981;border:1px solid rgba(16,185,129,.3);border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;white-space:nowrap">Auto-fill</button>
        </div>
      </div>
      <div>
        <label style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;display:block;margin-bottom:4px">Immagine</label>
        <div style="display:flex;gap:9px;align-items:flex-start">
          <div id="ib-img-prev" onclick="document.getElementById('ib-f-img-file').click()"
            style="width:72px;height:72px;border-radius:10px;background:rgba(255,255,255,.06);border:2px dashed rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;overflow:hidden;flex-shrink:0">📷</div>
          <div style="flex:1;display:flex;flex-direction:column;gap:6px">
            <input id="ib-f-img-url" type="url" placeholder="URL immagine (https://...immagine.jpg)" oninput="InspireBoard.previewImgUrl()" style="width:100%;padding:8px 10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#fff;font-size:11px;outline:none;box-sizing:border-box">
            <div style="display:flex;gap:6px">
              <button onclick="document.getElementById('ib-f-img-file').click()" style="padding:5px 12px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.12);border-radius:7px;cursor:pointer;font-size:11px">📷 Carica dal dispositivo</button>
              <button onclick="InspireBoard.clearImg()" style="padding:5px 9px;background:rgba(239,68,68,.08);color:#ef4444;border:1px solid rgba(239,68,68,.2);border-radius:7px;cursor:pointer;font-size:11px">✕</button>
            </div>
            <div style="font-size:9px;color:rgba(255,255,255,.25)">JPG, PNG, WEBP · max 3MB · o incolla URL</div>
          </div>
          <input type="file" id="ib-f-img-file" accept="image/*" style="display:none" onchange="InspireBoard.handleImgFile(this)">
        </div>
      </div>
      <div>
        <label style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;display:block;margin-bottom:4px">Note / Descrizione</label>
        <textarea id="ib-f-desc" rows="3" placeholder="Appunti, opportunità di mercato, materiali, dimensioni, prezzi stimati..." style="width:100%;padding:9px 12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:9px;color:#fff;font-size:12px;outline:none;resize:vertical;box-sizing:border-box;font-family:inherit"></textarea>
      </div>
      <div>
        <label style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;display:block;margin-bottom:4px">Tag (virgola)</label>
        <input id="ib-f-tags" placeholder="laser, etsy, natale, bestseller, personalizzato, legno..." style="width:100%;padding:9px 12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:9px;color:#fff;font-size:12px;outline:none;box-sizing:border-box">
      </div>
      <div>
        <label style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;display:block;margin-bottom:4px">File allegati</label>
        <div id="ib-f-files-list" style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px"></div>
        <button onclick="document.getElementById('ib-f-files').click()" style="padding:6px 14px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.12);border-radius:7px;cursor:pointer;font-size:11px">📎 Allega file PDF, SVG, DXF...</button>
        <input type="file" id="ib-f-files" multiple style="display:none" onchange="InspireBoard.handleFiles(this)">
      </div>
      <input type="hidden" id="ib-f-id">
      <div style="display:flex;gap:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.07)">
        <button id="ib-del-btn" onclick="InspireBoard.deleteIdea()" style="display:none;padding:10px 14px;background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.2);border-radius:10px;cursor:pointer;font-size:12px;font-weight:700">🗑 Elimina</button>
        <button onclick="InspireBoard.closeModal()" style="flex:1;padding:11px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.1);border-radius:10px;cursor:pointer;font-size:12px">Annulla</button>
        <button onclick="InspireBoard.saveIdea()" style="flex:2;padding:11px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1200;border:none;border-radius:10px;cursor:pointer;font-size:13px;font-weight:800">💾 Salva Idea</button>
      </div>
    </div>
  </div>
</div>
