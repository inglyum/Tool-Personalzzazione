

<!-- MODAL MAGAZZINO 3D -->
<div id="p3d-mat-modal" class="modal-overlay">
  <div class="modal modal-lg">
    <div class="modal-header"><div class="modal-title" style="color:#22d3ee">🗄️ Magazzino Materiali 3D</div><button class="modal-close" onclick="Print3DQuoter.closeMat()">✕</button></div>
    <div class="modal-body">
      <div style="background:#0a1a1f;border:1px solid #22d3ee35;border-radius:10px;padding:14px;margin-bottom:16px">
        <div style="font-size:11px;font-weight:700;color:#22d3ee;margin-bottom:10px">➕ AGGIUNGI MATERIALE</div>
        <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:8px;align-items:end">
          <div><label class="form-label" style="font-size:10px">Nome</label><input class="form-control" id="p3d-mn" placeholder="PLA+ Bambu Bianco 1kg"></div>
          <div><label class="form-label" style="font-size:10px">Tipo</label><select class="form-control" id="p3d-mt"><option value="fdm">FDM</option><option value="resin">Resina</option></select></div>
          <div><label class="form-label" style="font-size:10px">€/kg (o €/L)</label><input class="form-control" id="p3d-mp" type="number" step="0.5" placeholder="24"></div>
          <div><label class="form-label" style="font-size:10px">Unità (g/ml)</label><input class="form-control" id="p3d-muu" type="number" step="100" placeholder="1000"></div>
          <div><label class="form-label" style="font-size:10px">Fornitore</label><input class="form-control" id="p3d-ms" placeholder="Bambu Lab..."></div>
          <button class="btn btn-primary" style="height:36px;padding:0 14px;margin-top:auto;background:#22d3ee;color:#000" onclick="Print3DQuoter.addMat()">＋</button>
        </div>
      </div>
      <div id="p3d-mat-list"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="Print3DQuoter.closeMat()">Chiudi</button><button class="btn btn-primary" style="background:#22d3ee;color:#000" onclick="Print3DQuoter.closeMat()">✓ Applica</button></div>
  </div>
</div>
